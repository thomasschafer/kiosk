[package]
name = "herdr-app-kiosk"
version.workspace = true
edition.workspace = true
description = "Fuzzy repo and branch picker for the Herdr desktop app, drawn natively by its kiosk mod"
license = "MIT"
repository = "https://github.com/thomasschafer/kiosk"
publish = false

[dependencies]
anyhow.workspace = true
kiosk-core.workspace = true
kiosk-serve.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit = "0.25.18"

[dev-dependencies]
kiosk-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = [".", "crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
crossterm = "0.29"
kiosk-core = { path = "crates/kiosk-core" }
kiosk-docgen = { path = "crates/kiosk-docgen" }
kiosk-serve = { path = "crates/kiosk-serve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
