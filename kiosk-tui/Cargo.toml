[package]
name = "kiosk-tui"
version.workspace = true
edition.workspace = true
authors = ["thomasschafer97@gmail.com"]
license = "MIT"
description = "Terminal UI for kiosk pickers, generic over the multiplexer backend"
readme = "../README.md"
homepage = "https://github.com/thomasschafer/kiosk"
repository = "https://github.com/thomasschafer/kiosk"
keywords = ["cli", "worktree", "git", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
kiosk-core.workspace = true
ratatui.workspace = true
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
kiosk-core = { workspace = true, features = ["test-support"] }
toml.workspace = true

[lints]
workspace = true
