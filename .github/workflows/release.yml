name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  guard-version:
    name: Guard release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag, Cargo.toml and the mod to agree
        id: version
        shell: bash
        run: echo "version=$(scripts/check-version.sh "$GITHUB_REF_NAME")" >>"$GITHUB_OUTPUT"

      - name: Require the release commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: guard-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.guard-version.outputs.version }}
          target=${{ matrix.target }}
          extension=
          if [ "${{ runner.os }}" = Windows ]; then
            extension=.exe
          fi
          mkdir -p release-assets
          cp "target/${target}/release/herdr-app-kiosk${extension}" \
            "release-assets/herdr-app-kiosk-v${version}-${target}${extension}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [guard-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # Only the files the app loads: an install adds the binary under bin/ itself.
      - name: Pack the mod
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.guard-version.outputs.version }}
          tar -czf "release-assets/herdr-app-kiosk-mod-v${version}.tar.gz" \
            -C mods kiosk/main.js kiosk/mod.json

      - name: Generate checksums
        working-directory: release-assets
        shell: bash
        run: sha256sum herdr-app-kiosk-* >SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
