[package]
name = "kiosk"
version.workspace = true
edition.workspace = true
authors = ["thomasschafer97@gmail.com"]
license = "MIT"
description = "Tmux session manager with worktree support"
readme = "../README.md"
homepage = "https://github.com/thomasschafer/kiosk"
repository = "https://github.com/thomasschafer/kiosk"
keywords = ["cli", "tmux", "worktree", "git"]
categories = ["command-line-utilities"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
kiosk-core.workspace = true
kiosk-tui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kiosk-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
