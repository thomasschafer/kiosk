[workspace]
members = ["kiosk", "kiosk-core", "kiosk-tui", "kiosk-docgen", "xtask"]
default-members = ["kiosk"]
resolver = "3"

[workspace.package]
# NOTE: also update the kiosk-* versions in [workspace.dependencies] below
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
crossterm = "0.29"
kiosk-core = { version = "0.3.0", path = "kiosk-core" }
kiosk-tui = { version = "0.3.0", path = "kiosk-tui" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
