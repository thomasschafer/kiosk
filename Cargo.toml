[package]
name = "herdr-app-kiosk"
version = "0.2.0"
edition = "2024"
description = "Fuzzy repo and branch picker for the Herdr desktop app, drawn natively by its kiosk mod"
license = "MIT"
repository = "https://github.com/thomasschafer/herdr-app-kiosk"
publish = false

[dependencies]
anyhow = "1"
kiosk-core = "0.5"
kiosk-serve = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.18"

[dev-dependencies]
kiosk-core = { version = "0.5", features = ["test-support"] }
tempfile = "3"

[workspace]
members = [".", "xtask"]
resolver = "3"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lints]
workspace = true

[profile.release]
lto = true
